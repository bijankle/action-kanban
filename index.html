<!DOCTYPE html>
<html lang="en" data-theme="slate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Action Database</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css?v=1.0.0">
</head>
<body>
<div id="boot"><div class="bl"></div><div class="bar"><i></i></div><div class="bt">Loading actions</div></div>

<header id="hdr">
  <div id="brand" class="brand"></div>
  <nav id="menubar" class="menubar"></nav>
  <div id="pjBox"></div>
  <button id="updB" class="pj-up" type="button" title="Update app" aria-label="Update app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><i class="pj-dot"></i></button>
  <div class="tabs" role="tablist"><button class="tab" type="button" data-t="actions">Actions</button><button class="tab" type="button" data-t="kanban">Kanban</button><button class="tab" type="button" data-t="valid">Data validation</button></div>
  <span class="grow"></span>
  <button id="folderB" class="btn ghost sm" type="button" hidden>Reconnect folder</button>
  <button id="undoB" class="ic-b" type="button" title="Undo (Ctrl+Z)">↶</button><button id="redoB" class="ic-b" type="button" title="Redo (Ctrl+Y)">↷</button>
  <button id="status" class="status" type="button"></button>
</header>
<div id="tools">
  <div class="hsearch"><input id="q" class="in" type="search" placeholder="Search actions" autocomplete="off"></div>
  <div id="pills" class="pills"></div>
  <span class="grow"></span>
  <button id="colB" class="btn ghost sm edit-hide-no" type="button" title="Choose the table columns">Columns</button>
  <button id="printB" class="btn ghost sm" type="button">Print</button>
  <button id="xlsB" class="btn ghost sm" type="button">Excel</button>
  <button id="pasteB" class="btn ghost sm edit-only" type="button" title="Paste an email or note and Gemini fills in the fields">Paste text</button>
  <button id="newB" class="btn sm edit-only" type="button">+ New action</button>
</div>
<main id="main"><div id="view"></div><aside id="side"></aside></main>
<div id="mobile"></div>

<script src="js/util.js?v=1.0.0"></script>
<script src="js/gh.js?v=1.0.0"></script>
<script src="js/store.js?v=1.0.0"></script>
<script src="js/local.js?v=1.0.0"></script>
<script src="js/media.js?v=1.0.0"></script>
<script src="js/fields.js?v=1.0.0"></script>
<script src="js/table.js?v=1.0.0"></script>
<script src="js/panel.js?v=1.0.0"></script>
<script src="js/kanban.js?v=1.0.0"></script>
<script src="js/validation.js?v=1.0.0"></script>
<script src="js/print.js?v=1.0.0"></script>
<script src="js/excel.js?v=1.0.0"></script>
<script src="js/intake.js?v=1.0.0"></script>
<script src="js/importam.js?v=1.0.0"></script>
<script src="js/mobile.js?v=1.0.0"></script>
<script src="js/app.js?v=1.0.0"></script>
</body>
</html>
