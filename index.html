<!DOCTYPE html>
<html lang="en" data-theme="slate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Action Database</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css?v=1.7.10">
</head>
<body>
<div id="boot"><div class="bl"></div><div class="bar"><i></i></div><div class="bt">Loading actions</div></div>

<header id="hdr">
  <div id="brand" class="brand"></div>
  <nav id="menubar" class="menubar"></nav>
  <div id="pjBox"></div>
  <button id="updB" class="pj-up" type="button" title="Update app" aria-label="Update app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><i class="pj-dot"></i></button>
  <div class="tabs" role="tablist" aria-label="Actions"><button class="tab" type="button" data-t="actions">Actions</button><button class="tab" type="button" data-t="kanban">Organizer</button></div>
  <div class="tabs tabs-x" role="tablist" aria-label="Settings"><button class="tab" type="button" data-t="valid">Data validation</button></div>
  <span class="grow"></span>
  <button id="folderB" class="btn ghost sm" type="button" hidden>Reconnect folder</button>
  <button id="undoB" class="ic-b" type="button" title="Undo (Ctrl+Z)">↶</button><button id="redoB" class="ic-b" type="button" title="Redo (Ctrl+Y)">↷</button>
  <button id="status" class="status" type="button"></button>
  <button id="profB" class="prof-b" type="button" title="Your profile" aria-label="Your profile"></button>
</header>
<div id="tools">
  <div class="hsearch"><input id="q" class="in" type="search" placeholder="Search actions" autocomplete="off"></div>
  <div id="pills" class="pills"></div>
  <span class="grow"></span>
  <div id="vt" class="vt" role="group" aria-label="View"><button type="button" data-v="list" title="List">☰</button><button type="button" data-v="tiles" title="Tiles">▦</button></div>
  <button id="sizeB" class="btn ghost sm" type="button" title="Tile size">Size ▾</button>
  <button id="colB" class="btn ghost sm edit-hide-no" type="button" title="Choose the table columns">Columns</button>
  <button id="xlsB" class="dl dl-xl" type="button" title="Export to Excel: the actions as filtered, one row each, with a Photos link" aria-label="Export to Excel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10.5l5 5 5-5"/><path d="M5 20h14"/></svg><b>XLSX</b></button>
  <button id="printB" class="dl dl-pdf" type="button" title="Export to PDF or print: the Organizer board, then each action with its details and photos" aria-label="Export to PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10.5l5 5 5-5"/><path d="M5 20h14"/></svg><b>PDF</b></button>
  <button id="pasteB" class="btn ghost sm edit-only" type="button" title="Paste an email or note and Gemini fills in the fields">Paste text</button>
  <button id="newB" class="btn sm edit-only" type="button">+ New action</button>
</div>
<main id="main"><div id="view"></div></main>
<div id="mobile"></div>

<script src="js/util.js?v=1.7.10"></script>
<script src="js/gh.js?v=1.7.10"></script>
<script src="js/store.js?v=1.7.10"></script>
<script src="js/local.js?v=1.7.10"></script>
<script src="js/media.js?v=1.7.10"></script>
<script src="js/fields.js?v=1.7.10"></script>
<script src="js/table.js?v=1.7.10"></script>
<script src="js/actionview.js?v=1.7.10"></script>
<script src="js/kanban.js?v=1.7.10"></script>
<script src="js/validation.js?v=1.7.10"></script>
<script src="js/print.js?v=1.7.10"></script>
<script src="js/excel.js?v=1.7.10"></script>
<script src="js/intake.js?v=1.7.10"></script>
<script src="js/vendors.js?v=1.7.10"></script>
<script src="js/parts.js?v=1.7.10"></script>
<script src="js/isolsuggest.js?v=1.7.10"></script>
<script src="js/isol.js?v=1.7.10"></script>
<script src="js/sitemap.js?v=1.7.10"></script>
<script src="js/workpack.js?v=1.7.10"></script>
<script src="js/mobile.js?v=1.7.10"></script>
<script src="js/app.js?v=1.7.10"></script>
</body>
</html>
